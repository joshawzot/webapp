{% extends "base.html" %}

{% block content %}

<!-- Template: file_explorer.html -->
<div class="text-muted text-center mb-2" style="font-size: 0.8em; border-bottom: 1px solid #dee2e6; padding-bottom: 5px;">
    📄 <strong>Template:</strong> file_explorer.html
</div>

<div class="vs-container">
    <!-- Main container for Visual Studio-like interface -->
    <div class="vs-header">
        <div class="vs-title">File Explorer</div>
        <div class="vs-actions">
            <button id="new-file-btn" class="btn btn-sm btn-outline-secondary" title="New File">
                <i class="fas fa-file"></i>
            </button>
            <button id="new-directory-btn" class="btn btn-sm btn-outline-secondary" title="New Folder">
                <i class="fas fa-folder-plus"></i>
            </button>
            <button id="refresh-explorer-btn" class="btn btn-sm btn-outline-secondary" title="Refresh">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button id="home-dir-btn" class="btn btn-sm btn-outline-secondary" title="Home Directory">
                <i class="fas fa-home"></i>
            </button>
        </div>
    </div>

    <div class="vs-body">
        <!-- Explorer panel (left side) -->
        <div class="vs-explorer">
            <div class="vs-explorer-header">
                <span>EXPLORER</span>
            </div>
            <div class="vs-path-navigator">
                <input type="text" id="current-path" class="form-control form-control-sm" placeholder="Enter path...">
                <button id="go-path-btn" class="btn btn-sm btn-outline-secondary">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
            <div class="vs-file-tree" id="file-tree">
                <!-- File tree will be populated dynamically -->
                <div class="loading">Loading...</div>
            </div>
        </div>

        <!-- Editor panel (right side) -->
        <div class="vs-editor">
            <div class="vs-tabs" id="editor-tabs">
                <!-- Tabs will be added dynamically -->
                <div class="vs-tab-placeholder">No files open</div>
            </div>
            <div class="vs-editor-content" id="editor-content">
                <!-- Monaco editor will be initialized here -->
                <div class="vs-welcome">
                    <h3>Welcome to File Explorer</h3>
                    <p>Select a file from the explorer to edit it.</p>
                </div>
            </div>
            <div class="vs-status-bar">
                <div class="vs-file-info" id="file-info"></div>
                <div class="vs-editor-actions">
                    <button id="save-file-btn" class="btn btn-sm btn-outline-success" disabled title="Save File">
                        <i class="fas fa-save"></i> Save
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal for creating a new file -->
<div class="modal fade" id="new-file-modal" tabindex="-1" role="dialog" aria-labelledby="newFileModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="newFileModalLabel">Create New File</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="new-file-form">
                    <div class="form-group">
                        <label for="new-file-name">File Name:</label>
                        <input type="text" class="form-control" id="new-file-name" placeholder="Enter file name">
                    </div>
                    <input type="hidden" id="new-file-directory">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="create-file-btn">Create</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal for creating a new directory -->
<div class="modal fade" id="new-directory-modal" tabindex="-1" role="dialog" aria-labelledby="newDirectoryModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="newDirectoryModalLabel">Create New Folder</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="new-directory-form">
                    <div class="form-group">
                        <label for="new-directory-name">Folder Name:</label>
                        <input type="text" class="form-control" id="new-directory-name" placeholder="Enter folder name">
                    </div>
                    <input type="hidden" id="new-directory-parent">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="create-directory-btn">Create</button>
            </div>
        </div>
    </div>
</div>

<!-- Add Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<!-- Add Monaco Editor -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.37.1/min/vs/loader.min.js"></script>

<!-- Add custom CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/file_explorer.css') }}">

<!-- Add custom JavaScript -->
<script src="{{ url_for('static', filename='js/file_explorer.js') }}"></script>
{% endblock %}
