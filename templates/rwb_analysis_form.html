{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">GUI RWB Analysis</h3>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('process_rwb_analysis') }}">
                        
                        <!-- Data Fetching Parameters -->
                        <h4>Data Fetching Parameters</h4>
                        <div class="form-group">
                            <label for="regex">Regex Pattern:</label>
                            <input type="text" class="form-control" id="regex" name="regex" 
                                   value="tt007" placeholder="Enter regex pattern (e.g., tt007)">
                        </div>
                        
                        <div class="form-group">
                            <label for="regex_col">Regex Column:</label>
                            <select class="form-control" id="regex_col" name="regex_col">
                                <option value="">-- Select Column --</option>
                                {% if available_columns %}
                                    {% for col in available_columns %}
                                    <option value="{{ col }}" {% if col == 'DIE_ID' %}selected{% endif %}>{{ col }}</option>
                                    {% endfor %}
                                {% else %}
                                    <option value="DIE_ID" selected>DIE_ID</option>
                                    <option value="TEST_NAME">TEST_NAME</option>
                                    <option value="MACRO">MACRO</option>
                                    <option value="TEST_START_DATETIME">TEST_START_DATETIME</option>
                                {% endif %}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="date">Date Filter (optional):</label>
                            <input type="text" class="form-control" id="date" name="date" 
                                   placeholder="YYYY-MM-DD format (optional)">
                        </div>
                        
                        <div class="form-group">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="skip_rwb_2" name="skip_rwb_2" checked>
                                <label class="form-check-label" for="skip_rwb_2">
                                    Skip RWB_2 Database
                                </label>
                            </div>
                        </div>
                        
                        <!-- Data Filtering Parameters -->
                        <h4>Data Filtering Parameters</h4>
                        <div class="form-group">
                            <label for="test_name_filter">TEST_NAME Filter:</label>
                            <select class="form-control" id="test_name_filter" name="test_name_filter">
                                <option value="">-- Loading... --</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="macro_filter">MACRO Filter:</label>
                            <select class="form-control" id="macro_filter" name="macro_filter">
                                <option value="">-- Loading... --</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="datetime_filter">TEST_START_DATETIME Filter:</label>
                            <select class="form-control" id="datetime_filter" name="datetime_filter">
                                <option value="">-- Loading... --</option>
                            </select>
                        </div>
                        
                        <!-- Plot Parameters -->
                        <h4>Plot Parameters</h4>
                        <div class="form-group">
                            <label for="overlay_col">Overlay Column:</label>
                            <select class="form-control" id="overlay_col" name="overlay_col">
                                <option value="IO" selected>IO</option>
                                <option value="DIE_ID">DIE_ID</option>
                                <option value="MACRO">MACRO</option>
                                <option value="TEST_NAME">TEST_NAME</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="legend" name="legend">
                                <label class="form-check-label" for="legend">
                                    Show Legend
                                </label>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="plot_title">Plot Title:</label>
                            <input type="text" class="form-control" id="plot_title" name="plot_title" 
                                   value="DOE21: BLREF_CAL by IO" placeholder="Enter plot title">
                        </div>
                        
                        <!-- Mean Calculation Parameters -->
                        <h4>Mean Calculation Parameters</h4>
                        <div class="form-group">
                            <label for="groupby_cols">Group By Columns:</label>
                            <input type="text" class="form-control" id="groupby_cols" name="groupby_cols" 
                                   value="TEST_NAME" placeholder="Enter column names separated by commas">
                        </div>
                        
                        <div class="form-group text-center">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-play"></i> Run Analysis
                            </button>

                            <a href="{{ url_for('home') }}" class="btn btn-secondary btn-lg ml-2">
                                <i class="fas fa-arrow-left"></i> Back to Home
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Load values for the filter dropdowns
    loadColumnValues('TEST_NAME', 'test_name_filter', 'post-form');
    loadColumnValues('MACRO', 'macro_filter', '0');
    loadColumnValues('TEST_START_DATETIME', 'datetime_filter', '2025_06_27-15_57_38');
});

function loadColumnValues(columnName, selectId, defaultValue) {
    const selectElement = document.getElementById(selectId);
    
    // Show loading state
    selectElement.innerHTML = '<option value="">-- Loading... --</option>';
    
    fetch(`{{ url_for('get_rwb_column_values', column_name='PLACEHOLDER') }}`.replace('PLACEHOLDER', columnName))
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                selectElement.innerHTML = '<option value="">-- Error loading values --</option>';
                console.error('Error loading values for ' + columnName + ':', data.error);
            } else {
                // Clear the dropdown
                selectElement.innerHTML = '';
                
                // Add "All" option
                const allOption = document.createElement('option');
                allOption.value = '';
                allOption.textContent = '-- All --';
                selectElement.appendChild(allOption);
                
                // Add the values
                data.values.forEach(function(value) {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = value;
                    
                    // Set default selection
                    if (value == defaultValue) {
                        option.selected = true;
                    }
                    
                    selectElement.appendChild(option);
                });
                
                // If default value wasn't found in the list, try to find a partial match
                if (defaultValue && !selectElement.value) {
                    const partialMatch = data.values.find(v => 
                        v.toString().toLowerCase().includes(defaultValue.toLowerCase())
                    );
                    if (partialMatch) {
                        selectElement.value = partialMatch;
                    }
                }
                
                console.log(`Loaded ${data.values.length} values for ${columnName}`);
            }
        })
        .catch(error => {
            selectElement.innerHTML = '<option value="">-- Error loading values --</option>';
            console.error('Error fetching values for ' + columnName + ':', error);
        });
}
</script>

{% endblock %}
